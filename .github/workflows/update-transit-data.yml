name: Update XPLORE transit data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_transit_data.py'
      - '.github/workflows/update-transit-data.yml'
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xplore-transit-data
  cancel-in-progress: true

jobs:
  build-transit-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build compact Ireland transit dataset
        run: python scripts/build_transit_data.py

      - name: Commit refreshed transit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit/manifest.json data/transit/stops.json data/transit/trips.json
          if git diff --cached --quiet; then
            echo "Transit data already current"
            exit 0
          fi
          git commit -m "Refresh Ireland transit schedules"
          git push
