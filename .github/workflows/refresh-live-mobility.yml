name: Refresh XPLORE live mobility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-live-mobility.yml'
      - 'scripts/build_realtime_snapshot.py'
      - 'realtime-core.js'
      - 'realtime-v07.js'
      - 'transit-live-patch-v07.js'
      - 'data/transit/manifest.json'
      - 'data/transit/realtime_eligible.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'push' && 'live-mobility-validation' || 'pages' }}
  cancel-in-progress: false

jobs:
  refresh-live-mobility:
    runs-on: ubuntu-latest
    env:
      NTA_GTFS_RT_API_KEY: ${{ secrets.NTA_GTFS_RT_API_KEY }}
      XPLORE_NTA_GTFS_RT_URL: ${{ vars.XPLORE_NTA_GTFS_RT_URL }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check realtime configuration
        id: config
        shell: bash
        run: |
          if [ -n "$NTA_GTFS_RT_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "NTA realtime secret is configured"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NTA realtime secret is not configured; scheduled refresh will not redeploy Pages"
          fi

      - name: Set up Python
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GTFS-Realtime decoder
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check gtfs-realtime-bindings==3.0.0

      - name: Build strict realtime snapshot
        if: steps.config.outputs.enabled == 'true'
        run: python scripts/build_realtime_snapshot.py

      - name: Configure Pages
        if: steps.config.outputs.enabled == 'true' && github.event_name != 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload current site with realtime snapshot
        if: steps.config.outputs.enabled == 'true' && github.event_name != 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed live mobility
        if: steps.config.outputs.enabled == 'true' && github.event_name != 'push'
        uses: actions/deploy-pages@v4
